
{% extends "base.html" %}

{% block content %}

<h3>My Profile</h3>

<form method="post">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <p>
        <label>Name<br>
            <input
                name="name"
                value="{{ current_user.name }}"
                required
            >
        </label>
    </p>

    <p>
        <label>Email<br>
            <input
                type="email"
                name="email"
                value="{{ current_user.email }}"
                required
            >
        </label>
    </p>

    <button type="submit">Save Profile</button>

</form>

{% endblock %}
