
{% extends "base.html" %}

{% block content %}

<h3>Change Password</h3>

<form method="post">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <p>
        <label>Current Password<br>
            <input
                type="password"
                name="old_password"
                required
            >
        </label>
    </p>

    <p>
        <label>New Password<br>
            <input
                type="password"
                name="new_password"
                minlength="10"
                required
            >
        </label>
    </p>

    <button type="submit">Change Password</button>

</form>

{% endblock %}
